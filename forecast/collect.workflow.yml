# Goes in .github/workflows/collect.yml when forecast/ is its own repository (it expects requirements.txt and data/ at the repo root).
name: collect
# Logs the Rodalies feed to daily CSVs on a `data` branch. GitHub's shortest cron interval is 5 minutes and
# runs can be delayed or skipped, so the log has gaps; the model code treats polls as irregular.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Attach the data branch
        run: |
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add logdata origin/data --detach
          else
            git worktree add --orphan -b data logdata
          fi
      - name: Poll once
        run: python -m rodalies_run collect --csv-dir logdata/log
      - name: Commit the new rows
        working-directory: logdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log
          git diff --cached --quiet && exit 0
          git commit -m "log $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git push origin HEAD:data && break
            git fetch origin data && git rebase origin/data || true
            sleep $((i * 3))
          done
